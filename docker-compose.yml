version: "3.9"

services:
  backend:
    build: .
    container_name: recommender-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: .
    container_name: recommender-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    command: ["streamlit", "run", "src/frontend.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped